name: Reconcile Version 57 Mirepoix assets

on:
  push:
    branches:
      - stabilize/production-publishing-reconciliation
    paths:
      - ".github/workflows/reconcile-version57-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/production-publishing-reconciliation
          fetch-depth: 0

      - name: Download exact Version 57 production assets
        shell: bash
        run: |
          set -euo pipefail
          dir="public/images/editorial/mirepoix-foundations-of-flavor"
          mkdir -p "$dir"
          curl --fail --location --retry 3             "https://chefgringo.com/images/editorial/mirepoix-foundations-of-flavor/rustic_mirepoix_saute_in_copper_pan.png"             --output "$dir/rustic_mirepoix_saute_in_copper_pan.png"
          curl --fail --location --retry 3             "https://chefgringo.com/images/editorial/mirepoix-foundations-of-flavor/mirepoix_the_story_beneath_dinner.png"             --output "$dir/mirepoix_the_story_beneath_dinner.png"
          curl --fail --location --retry 3             "https://chefgringo.com/images/editorial/mirepoix-foundations-of-flavor/mirepoix_the_aromatic_foundation.png"             --output "$dir/mirepoix_the_aromatic_foundation.png"

      - name: Verify production checksums
        shell: bash
        run: |
          set -euo pipefail
          dir="public/images/editorial/mirepoix-foundations-of-flavor"
          echo "a6ac46f705cbcf60c2496d3fcd73285bd67d9438d4aec29e5896977638f363eb  $dir/rustic_mirepoix_saute_in_copper_pan.png" | sha256sum -c -
          echo "e9cc58b180127960b9862d11507869129d822d969adf69413df4ddfcc08e69da  $dir/mirepoix_the_story_beneath_dinner.png" | sha256sum -c -
          echo "8205598a4279ea3a578ca714d209f6ec03911d9ad7f6fc72d8d1ac5095c1c2fb  $dir/mirepoix_the_aromatic_foundation.png" | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          base=Path("public/images/editorial/mirepoix-foundations-of-flavor")
          expected={
            "rustic_mirepoix_saute_in_copper_pan.png":(1672,941),
            "mirepoix_the_story_beneath_dinner.png":(1122,1402),
            "mirepoix_the_aromatic_foundation.png":(1122,1402),
          }
          for name,size in expected.items():
              with Image.open(base/name) as im:
                  assert im.size == size, (name, im.size, size)
                  assert im.format == "PNG", (name, im.format)
          PY

      - name: Commit recovered binaries if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/images/editorial/mirepoix-foundations-of-flavor/*.png; then
            echo "Production PNG assets already match GitHub."
            exit 0
          fi
          git config user.name "chef-gringo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/editorial/mirepoix-foundations-of-flavor/*.png
          git commit -m "Reconcile Version 57 Mirepoix production PNG assets"
          git push origin HEAD:stabilize/production-publishing-reconciliation
