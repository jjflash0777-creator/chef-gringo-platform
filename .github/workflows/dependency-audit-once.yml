name: One-time dependency audit
on:
  push:
    branches:
      - stabilize/production-publishing-reconciliation
    paths:
      - ".github/workflows/dependency-audit-once.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/production-publishing-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --json

# rerun after Next 16.4.4

# final runtime audit
