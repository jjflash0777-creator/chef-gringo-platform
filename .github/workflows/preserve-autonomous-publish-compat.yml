name: Preserve autonomous publish compatibility
on:
  push:
    branches:
      - stabilize/production-publishing-reconciliation
    paths:
      - ".github/workflows/preserve-autonomous-publish-compat.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/production-publishing-reconciliation
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/growth/social/types.ts")
          s=p.read_text()
          needle="export const SOCIAL_AUTONOMOUS_PUBLISH_AVAILABLE = false;"
          alias=needle+"\n/** @deprecated Legacy autonomous-publish flag. Runtime Buffer capability is resolved server-side. */\nexport const SOCIAL_PUBLISH_AVAILABLE = SOCIAL_AUTONOMOUS_PUBLISH_AVAILABLE;"
          if "export const SOCIAL_PUBLISH_AVAILABLE = SOCIAL_AUTONOMOUS_PUBLISH_AVAILABLE;" not in s:
              s=s.replace(needle,alias)
          p.write_text(s)

          p=Path("app/growth/social/index.ts")
          s=p.read_text()
          if "SOCIAL_PUBLISH_AVAILABLE," not in s:
              s=s.replace("  SOCIAL_AUTONOMOUS_PUBLISH_AVAILABLE,\n", "  SOCIAL_AUTONOMOUS_PUBLISH_AVAILABLE,\n  SOCIAL_PUBLISH_AVAILABLE,\n")
          p.write_text(s)
          PY
          git config user.name chef-gringo-release-bot
          git config user.email actions@users.noreply.github.com
          git add app/growth/social/types.ts app/growth/social/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Preserve autonomous publish compatibility alias"
          git push origin HEAD:stabilize/production-publishing-reconciliation
