name: Refresh thermometer lifecycle
on:
  push:
    branches:
      - stabilize/production-publishing-reconciliation
    paths:
      - ".github/workflows/refresh-thermometer-lifecycle.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/production-publishing-reconciliation
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/marketplace/thermometer-types/page.tsx")
          s=p.read_text()
          s=s.replace("Thermapen ONE and ThermoPop 2 fit this job at different price points.", "Thermapen NANO and ThermoPop 2 fit this job at different price points; Thermapen ONE is outgoing closeout inventory.")
          s=s.replace('<li><Link href="/marketplace/products/thermoworks-thermapen-one"><strong>Thermapen ONE</strong></Link> — premium instant-read.</li>', '<li><strong>Thermapen NANO</strong> — current ThermoWorks flagship instant-read; verify the current product page before purchase.</li>\n            <li><Link href="/marketplace/products/thermoworks-thermapen-one"><strong>Thermapen ONE</strong></Link> — outgoing closeout model; compare only while inventory remains.</li>')
          p.write_text(s)
          PY
          git config user.name chef-gringo-release-bot
          git config user.email actions@users.noreply.github.com
          git add app/marketplace/thermometer-types/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Refresh thermometer lifecycle for NANO successor"
          git push origin HEAD:stabilize/production-publishing-reconciliation
