name: Patch remaining runtime audit findings
on:
  push:
    branches:
      - stabilize/production-publishing-reconciliation
    paths:
      - ".github/workflows/patch-runtime-audit.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/production-publishing-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply non-breaking production audit fixes
        run: npm audit fix --omit=dev
      - name: Commit lockfile fixes
        run: |
          git config user.name chef-gringo-release-bot
          git config user.email actions@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Patch remaining runtime dependency advisories"
          git push origin HEAD:stabilize/production-publishing-reconciliation
