name: Fix Buffer publisher lint
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/production-publishing-reconciliation
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/admin/growth/buffer/BufferPublisher.tsx")
          s=p.read_text()
          s=s.replace('import { FormEvent, useEffect, useState } from "react";','import { FormEvent, useState } from "react";')
          s=s.replace('  useEffect(() => { refresh().catch((error) => setStatus(error.message)); }, []);\n','')
          p.write_text(s)
          PY
          git config user.name chef-gringo-release-bot
          git config user.email actions@users.noreply.github.com
          git add app/admin/growth/buffer/BufferPublisher.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Buffer publisher lint"
          git push origin HEAD:stabilize/production-publishing-reconciliation
