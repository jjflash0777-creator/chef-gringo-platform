name: One-time source reconciliation

on:
  push:
    branches:
      - stabilize/production-publishing-reconciliation
    paths:
      - ".github/workflows/reconcile-source-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/production-publishing-reconciliation
          fetch-depth: 0

      - name: Fetch source branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Recover reviewed Buffer transport pieces from PR 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/lib app/api/social/buffer/channels app/api/social/buffer/queue
          git show origin/feature/buffer-one-command-publishing:app/lib/buffer-api.ts > app/lib/buffer-api.ts
          git show origin/feature/buffer-one-command-publishing:app/api/social/buffer/channels/route.ts > app/api/social/buffer/channels/route.ts
          git show origin/feature/buffer-one-command-publishing:app/api/social/buffer/queue/route.ts > app/api/social/buffer/queue/route.ts

      - name: Recover Growth Factory from PR 22
        shell: bash
        run: |
          set -euo pipefail
          for path in             app/admin/growth-factory/GrowthFactory.tsx             app/admin/growth-factory/growth-factory.module.css             app/admin/growth-factory/page.tsx             app/api/growth/factory/generate/route.ts             app/api/growth/factory/status/route.ts             app/growth/factory-provider.ts             app/growth/factory.ts             tests/growth-factory.test.mjs
          do
            mkdir -p "$(dirname "$path")"
            git show "origin/feature/ai-growth-factory-v1:$path" > "$path"
          done

      - name: Recover evergreen November editorial work from PR 33
        shell: bash
        run: |
          set -euo pipefail
          for path in             app/business/food-cost-drift/page.tsx             app/business/page.tsx             app/knowledge/dishes/carbonara/page.tsx             app/knowledge/dishes/carbonara/why-carbonara-scrambles/page.tsx             app/marketplace/thermometer-types/page.tsx
          do
            mkdir -p "$(dirname "$path")"
            git show "origin/feature/nov-week1-editorial-sprint:$path" > "$path"
          done

      - name: Recover Kitchen Workhorses evergreen guide from PR 21
        shell: bash
        run: |
          set -euo pipefail
          for path in             app/marketplace/kitchen-workhorses/page.tsx             app/marketplace/kitchen-workhorses/kitchen-workhorses.module.css
          do
            mkdir -p "$(dirname "$path")"
            git show "origin/feature/kitchen-workhorses-guide:$path" > "$path"
          done

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          git add app tests
          if git diff --cached --quiet; then
            echo "No source reconciliation changes."
            exit 0
          fi
          git config user.name "chef-gringo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Recover Buffer, Growth Factory, and evergreen editorial source"
          git push origin HEAD:stabilize/production-publishing-reconciliation
