name: Patch Next production security
on:
  push:
    branches:
      - stabilize/production-publishing-reconciliation
    paths:
      - ".github/workflows/patch-next-security.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/production-publishing-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install next@16.4.4 --save-exact
      - name: Verify installed Next version
        run: node -e "console.log(require('next/package.json').version)"
      - name: Commit security update
        run: |
          git config user.name chef-gringo-release-bot
          git config user.email actions@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade Next to 16.4.4 for security fixes"
          git push origin HEAD:stabilize/production-publishing-reconciliation
