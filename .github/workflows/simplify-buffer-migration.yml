name: Simplify Buffer migration to additive only
on:
  push:
    branches:
      - stabilize/production-publishing-reconciliation
    paths:
      - ".github/workflows/simplify-buffer-migration.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/production-publishing-reconciliation
      - name: Keep manual publication table untouched
        shell: python
        run: |
          from pathlib import Path

          Path("drizzle/0022_social_buffer_publishing_reconciliation.sql").write_text("""-- Additive reconciliation of the production Buffer dispatch ledger.
          -- Production Sites historically created this table outside canonical GitHub.
          -- Do not reuse historical migration identities and do not rebuild social_publications.

          CREATE TABLE IF NOT EXISTS `social_buffer_publications` (
            `id` text PRIMARY KEY NOT NULL,
            `package_id` text NOT NULL,
            `variant_id` text NOT NULL,
            `channel` text NOT NULL,
            `buffer_channel_id` text NOT NULL,
            `buffer_post_id` text NOT NULL,
            `due_at` text,
            `status` text NOT NULL,
            `queued_at` text NOT NULL,
            `actor_email` text NOT NULL,
            `created_at` text DEFAULT CURRENT_TIMESTAMP NOT NULL,
            `updated_at` text DEFAULT CURRENT_TIMESTAMP NOT NULL,
            FOREIGN KEY (`package_id`) REFERENCES `social_content_packages`(`id`) ON UPDATE no action ON DELETE cascade,
            FOREIGN KEY (`variant_id`) REFERENCES `social_channel_variants`(`id`) ON UPDATE no action ON DELETE cascade,
            CONSTRAINT `social_buffer_publications_channel_check` CHECK(`channel` in ('facebook', 'instagram', 'pinterest', 'tiktok'))
          );
          --> statement-breakpoint
          CREATE UNIQUE INDEX IF NOT EXISTS `social_buffer_publications_buffer_post_idx` ON `social_buffer_publications` (`buffer_post_id`);
          --> statement-breakpoint
          CREATE INDEX IF NOT EXISTS `social_buffer_publications_variant_idx` ON `social_buffer_publications` (`variant_id`);
          """)

          p=Path("db/schema.ts")
          s=p.read_text().replace(
              "check(\"social_publications_mode_check\", sql`${table.mode} in ('manual', 'api')`),",
              "check(\"social_publications_mode_check\", sql`${table.mode} = 'manual'`),"
          )
          p.write_text(s)

          p=Path("db/social-growth-repository.ts")
          s=p.read_text()
          start=s.find("export async function prepareApiSocialPublication(")
          end=s.find("export type BufferScheduledPublication", start)
          if start < 0 or end < 0:
              raise SystemExit("prepareApiSocialPublication block not found")
          replacement='''export async function prepareBufferSocialPublication(
            db: D1DatabaseLike,
            input: {
              slug: string;
              packageId: string;
              variantId: string;
              channel?: string;
              actorEmail: string;
              destinationUrlId?: string | null;
            },
          ) {
            const { pkg, variant, destination } = await resolvePublicationSubject(db, input);
            const publicationId = socialPublicationId(input.slug);
            const tracked = mintPublicationTrackedUrl({
              pathOrUrl: destination.href,
              channel: variant.channel,
              packageId: pkg.id,
              variantId: variant.id,
              publicationId,
            });
            return {
              package: pkg,
              variant,
              destination,
              publicationId,
              actorEmail: input.actorEmail,
              attribution: socialPublicationAttribution({
                packageId: pkg.id,
                variantId: variant.id,
                publicationId,
                destinationUrlId: destination.id,
                trackedHref: tracked.href,
                channel: variant.channel,
              }),
            };
          }

          '''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          p=Path("app/api/growth/publications/buffer/route.ts")
          s=p.read_text()
          s=s.replace("prepareApiSocialPublication,", "prepareBufferSocialPublication,")
          s=s.replace("const reservation = await prepareApiSocialPublication(db, {", "const reservation = await prepareBufferSocialPublication(db, {")
          p.write_text(s)

          p=Path("tests/buffer-publishing.test.mjs")
          s=p.read_text()
          s=s.replace(
            "  const sql = db.database.prepare(\"SELECT sql FROM sqlite_master WHERE type='table' AND name='social_publications'\").get().sql;\n  assert.match(sql, /'manual', 'api'/);",
            "  const sql = db.database.prepare(\"SELECT sql FROM sqlite_master WHERE type='table' AND name='social_publications'\").get().sql;\n  assert.match(sql, /mode.*manual/s);\n  assert.doesNotMatch(sql, /'api'/);"
          )
          s=s.replace("prepareApiSocialPublication", "prepareBufferSocialPublication")
          p.write_text(s)

      - name: Commit additive-only migration
        run: |
          git config user.name chef-gringo-release-bot
          git config user.email actions@users.noreply.github.com
          git add drizzle/0022_social_buffer_publishing_reconciliation.sql db/schema.ts db/social-growth-repository.ts app/api/growth/publications/buffer/route.ts tests/buffer-publishing.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Keep Buffer reconciliation migration additive only"
          git push origin HEAD:stabilize/production-publishing-reconciliation
