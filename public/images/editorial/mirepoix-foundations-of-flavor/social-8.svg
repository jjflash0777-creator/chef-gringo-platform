<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11100E"/><stop offset="1" stop-color="#2A2118"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect x="64" y="62" width="10" height="68" rx="5" fill="#C96B2C"/>
  <text x="96" y="88" font-family="Arial, sans-serif" font-size="24" letter-spacing="5" fill="#D8C8B0">CHEF GRINGO</text>
  <text x="96" y="124" font-family="Arial, sans-serif" font-size="18" letter-spacing="4" fill="#8F8271">SLIDE 8 OF 8</text>
  <text x="96" y="260" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#F6F0E5">Don’t Memorize</text>
<text x="96" y="342" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#F6F0E5">Mirepoix.</text>
  <line x1="96" y1="464" x2="984" y2="464" stroke="#C96B2C" stroke-width="4"/>
  <text x="96" y="594" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#E2D8CA">Understand what the ingredients are doing.</text>
<text x="96" y="650" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#E2D8CA">Then adjust the ratio, cut and heat for the dish in front of you.</text>
<text x="96" y="706" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#E2D8CA">That is the difference between repeating a formula</text>
<text x="96" y="762" font-family="Arial, sans-serif" font-size="38" font-weight="400" fill="#E2D8CA">and actually knowing how to cook.</text>
  <circle cx="860" cy="1060" r="110" fill="#C96B2C" opacity=".16"/>
  <circle cx="928" cy="1130" r="72" fill="#6E8B52" opacity=".22"/>
